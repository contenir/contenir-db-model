# Databases for running the integration suite locally:
#
#   docker compose up -d
#   DB_PLATFORM=mysql DB_PORT=33306 DB_PASSWORD=secret composer test-integration
#   DB_PLATFORM=pgsql DB_PORT=55432 DB_USER=postgres DB_PASSWORD=secret composer test-integration
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: contenir_test
    ports:
      - "33306:3306"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: contenir_test
    ports:
      - "55432:5432"
