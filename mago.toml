extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "tests"]
includes = ["vendor"]

[linter.rules]
# The shared base excludes "test/"; this repository keeps its suites under "tests/".
# Exception classes are message catalogues with one named constructor per failure,
# following php-db's own exclusion of its exception directories.
too-many-methods = { exclude = ["tests/", "src/Exception/"] }

[analyzer]
excludes = ["tests"]
